<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Feliz San Valentín ❤️</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff5f9e, #ff8ccf);
    color: white;
    text-align: center;
    overflow-x: hidden;
}

h1 {
    margin-top: 40px;
    font-size: 2.8em;
}

p {
    font-size: 1.3em;
}

/* 🎠 Carrusel */
.carrusel {
    position: relative;
    width: 90%;
    max-width: 360px;
    height: 460px;
    margin: 40px auto;
    overflow: hidden;
    border-radius: 25px;
    background: rgba(255,255,255,0.15);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.carrusel img {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 100%;
    height: 100%;
    object-fit: contain; /* 🔥 NO corta la foto */
    opacity:  (
        0
    );
    transition: opacity 1.2s ease-in-out;
}

/* ❤️ Corazones */
.heart {
    position: fixed;
    bottom: -20px;
    color: rgba(255,255,255,0.8);
    animation: flotar linear infinite;
    pointer-events: none;
}

@keyframes flotar {
    from { transform: translateY(0); opacity: 1; }
    to   { transform: translateY(-110vh); opacity: 0; }
}

footer {
    margin-bottom: 30px;
    font-size: 1.2em;
}
</style>
</head>

<body>

<h1>💖 Feliz San Valentín 💖</h1>
<p>Gracias por cada momento juntos 💕</p>

<div class="carrusel">
    <img src="foto1.jpg">
    <img src="foto2.jpg">
    <img src="foto3.jpg">
    <img src="foto4.jpg">
</div>

<footer>Con todo mi amor 💘</footer>

<script>
const fotos = document.querySelectorAll(".carrusel img");
let indice = 0;

function mostrarFoto(n) {
    fotos.forEach((img, i) => {
        img.style.opacity = i === n ? "1" : "0";
    });
}

if (fotos.length > 0) {
    mostrarFoto(indice);

    setInterval(() => {
        indice = (indice + 1) % fotos.length; // 🔁 vuelve al inicio
        mostrarFoto(indice);
    }, 4000);
}

/* ❤️ Corazones */
function crearCorazon() {
    const c = document.createElement("div");
    c.className = "heart";
    c.innerHTML = "❤️";
    c.style.left = Math.random() * 100 + "vw";
    c.style.fontSize = (15 + Math.random() * 25) + "px";
    c.style.animationDuration = (5 + Math.random() * 5) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 9000);
}
setInterval(crearCorazon, 350);
</script>

</body>
</html>
